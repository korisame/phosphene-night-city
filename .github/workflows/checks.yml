name: Source checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: source-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  rust:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: |
          cargo fmt --check --manifest-path rust-core/Cargo.toml
          cargo fmt --check --manifest-path native-rust/Cargo.toml
      - name: Core and native regression tests
        run: |
          cargo test --locked --manifest-path rust-core/Cargo.toml
          cargo test --locked --manifest-path native-rust/Cargo.toml --bin phosphene-native
      - name: Strict lint
        run: |
          cargo clippy --locked --manifest-path rust-core/Cargo.toml --all-targets -- -D warnings
          cargo clippy --locked --manifest-path native-rust/Cargo.toml --all-targets -- -D warnings
  showcase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - name: Website and renderer syntax
        run: |
          node --check docs/app.js
          for script in wallpapers/night-city/*.cjs; do node --check "$script"; done
          node --input-type=module -e "import fs from 'node:fs'; const c=JSON.parse(fs.readFileSync('docs/releases.json')); if(c.current!==7||c.releases.length!==7)process.exit(1);"
